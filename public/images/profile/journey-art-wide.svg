<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="820" viewBox="0 0 1620 820">
  <defs>
    <linearGradient id="warm" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f4b860"/>
      <stop offset="0.5" stop-color="#d97e4a"/>
      <stop offset="1" stop-color="#7a4a42"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93a9c6"/>
      <stop offset="0.4" stop-color="#486084"/>
      <stop offset="1" stop-color="#33455f"/>
    </linearGradient>
    <linearGradient id="blend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4a42" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#7a4a42" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#486084" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#486084" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9c4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe9c4" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0.06 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <!-- left: Tanzania evening -->
    <rect width="810" height="820" fill="url(#warm)"/>
    <circle cx="420" cy="560" r="190" fill="url(#sunGlow)"/>
    <circle cx="420" cy="560" r="82" fill="#fdeccd"/>
    <rect y="640" width="810" height="180" fill="#241b18"/>
    <!-- ocean horizon -->
    <rect y="640" width="810" height="10" fill="#3a2a24" opacity="0.6"/>
    <!-- dhow -->
    <path d="M600 636 l64 0 l-12 14 l-40 0 z" fill="#241b18"/>
    <path d="M632 634 l0 -52 l30 50 z" fill="#241b18"/>
    <!-- acacias -->
    <g fill="#2a1c16">
      <path d="M96 820 l0 -104 q0 -10 9 -10 q9 0 9 10 l0 104 z"/>
      <path d="M105 720 q-70 -22 -104 -12 l104 -7 q-44 -28 -86 -30 q48 2 94 22 q8 -34 2 -62 q11 28 7 66 q38 -32 86 -38 q-48 16 -80 42 l4 19 z"/>
      <path d="M196 820 l0 -64 q0 -8 8 -8 q8 0 8 8 l0 64 z"/>
      <path d="M204 760 q-44 -15 -68 -9 l68 -4 q-28 -19 -56 -19 q32 2 60 15 q4 -24 0 -42 q9 20 5 44 q24 -22 55 -24 q-33 11 -57 28 l0 11 z"/>
    </g>
    <g stroke="#241b18" stroke-width="4" stroke-linecap="round">
      <path d="M60 720 q8 -30 4 -50"/><path d="M120 736 q10 -34 6 -56"/><path d="M300 724 q-6 -30 2 -48"/>
      <path d="M420 742 q10 -32 6 -52"/><path d="M680 728 q8 -28 4 -46"/><path d="M760 744 q10 -32 6 -52"/>
    </g>
    <!-- birds -->
    <g stroke="#3a2620" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M300 380 q12 -14 24 0"/><path d="M324 380 q12 -14 24 0"/>
      <path d="M380 410 q10 -12 20 0"/><path d="M400 410 q10 -12 20 0"/>
    </g>
    <!-- left label -->
    <text x="56" y="764" font-family="'Courier New', monospace" font-size="22" letter-spacing="2.5" fill="#f6e7cf" opacity="0.92">DAR ES SALAAM</text>
    <text x="56" y="796" font-family="'Courier New', monospace" font-size="19" letter-spacing="2" fill="#f6e7cf" opacity="0.7">6°51′S · 39°17′E</text>

    <!-- right: Russia winter dusk -->
    <rect x="810" width="810" height="820" fill="url(#cool)"/>
    <circle cx="1180" cy="130" r="34" fill="#e9eef5" opacity="0.85"/>
    <circle cx="1194" cy="120" r="31" fill="url(#cool)"/>
    <g fill="#eef2f7">
      <circle cx="900" cy="180" r="2.5" opacity="0.6"/><circle cx="1000" cy="260" r="2" opacity="0.5"/>
      <circle cx="1120" cy="140" r="2.5" opacity="0.6"/><circle cx="1230" cy="240" r="2" opacity="0.45"/>
      <circle cx="1340" cy="150" r="2.5" opacity="0.6"/><circle cx="1440" cy="300" r="2" opacity="0.5"/>
      <circle cx="960" cy="420" r="2" opacity="0.4"/><circle cx="1380" cy="420" r="2.2" opacity="0.4"/>
    </g>
    <!-- skyline -->
    <g fill="#232c3d">
      <rect x="810" y="560" width="810" height="120"/>
      <rect x="920" y="430" width="70" height="130"/>
      <rect x="940" y="366" width="32" height="66"/>
      <path d="M956 316 q-26 34 -17 52 h34 q9 -18 -17 -52 z"/>
      <line x1="956" y1="292" x2="956" y2="316" stroke="#232c3d" stroke-width="5"/>
      <circle cx="956" cy="290" r="6"/>
      <rect x="1120" y="486" width="52" height="74"/>
      <rect x="1250" y="452" width="62" height="108"/>
      <rect x="1266" y="410" width="30" height="44"/>
      <path d="M1281 372 q-21 26 -13 40 h26 q8 -14 -13 -40 z"/>
      <rect x="1420" y="470" width="56" height="90"/>
      <rect x="1540" y="440" width="48" height="120"/>
      <rect x="1554" y="398" width="22" height="44"/>
      <path d="M1565 356 q-17 22 -11 34 h22 q7 -12 -11 -34 z"/>
    </g>
    <g fill="#eef2f7" opacity="0.9">
      <ellipse cx="1215" cy="680" rx="640" ry="46"/>
    </g>
    <!-- right label -->
    <text x="1564" y="764" text-anchor="end" font-family="'Courier New', monospace" font-size="22" letter-spacing="2.5" fill="#eef2f7" opacity="0.92">ROSTOV-ON-DON</text>
    <text x="1564" y="796" text-anchor="end" font-family="'Courier New', monospace" font-size="19" letter-spacing="2" fill="#eef2f7" opacity="0.7">47°14′N · 39°42′E</text>

    <!-- seam blend -->
    <rect x="730" width="160" height="820" fill="url(#blend)" opacity="0.5"/>

    <!-- the meridian: dotted arc left to right -->
    <path d="M120 700 C 400 640, 560 520, 810 430 S 1300 300, 1500 220"
      fill="none" stroke="#426be6" stroke-width="5" stroke-dasharray="2 18" stroke-linecap="round"/>
    <!-- plane -->
    <g transform="translate(810 430) rotate(-24)">
      <path d="M-27 0 l54 0 l-10 12 l-44 0 z" fill="#eef2f7"/>
      <path d="M-7 -2 l0 -26 l16 24 z" fill="#eef2f7"/>
      <path d="M-7 12 l0 16 l12 -14 z" fill="#eef2f7"/>
    </g>
    <!-- meridian note under the arc -->
    <text x="810" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#f4f3ef">both on 39° east — the same meridian</text>

    <!-- stamp -->
    <g transform="translate(1330 96) rotate(4)">
      <rect x="-8" y="-8" width="164" height="104" fill="#f4f3ef"/>
      <rect x="0" y="0" width="148" height="88" fill="#426be6"/>
      <g transform="translate(28 44)">
        <path d="M-14 0 l24 0 l-5 6 l-19 0 z" fill="#f4f3ef"/>
        <path d="M-2 -2 l0 -14 l9 13 z" fill="#f4f3ef"/>
        <path d="M-2 6 l0 8 l6 -6 z" fill="#f4f3ef"/>
      </g>
      <text x="64" y="38" font-family="'Courier New', monospace" font-size="15" letter-spacing="1.5" fill="#f4f3ef">TZ → RU</text>
      <text x="56" y="58" font-family="'Courier New', monospace" font-size="10" letter-spacing="0.5" fill="#dbe4f6">39°E MERIDIAN</text>
      <g fill="#f4f3ef" opacity="0.85">
        <circle cx="-8" cy="0" r="2.6"/><circle cx="-8" cy="18" r="2.6"/><circle cx="-8" cy="36" r="2.6"/><circle cx="-8" cy="54" r="2.6"/><circle cx="-8" cy="72" r="2.6"/><circle cx="-8" cy="96" r="2.6"/>
        <circle cx="156" cy="0" r="2.6"/><circle cx="156" cy="18" r="2.6"/><circle cx="156" cy="36" r="2.6"/><circle cx="156" cy="54" r="2.6"/><circle cx="156" cy="72" r="2.6"/><circle cx="156" cy="96" r="2.6"/>
        <circle cx="4" cy="-8" r="2.6"/><circle cx="24" cy="-8" r="2.6"/><circle cx="44" cy="-8" r="2.6"/><circle cx="64" cy="-8" r="2.6"/><circle cx="84" cy="-8" r="2.6"/><circle cx="104" cy="-8" r="2.6"/><circle cx="124" cy="-8" r="2.6"/><circle cx="144" cy="-8" r="2.6"/>
        <circle cx="4" cy="96" r="2.6"/><circle cx="24" cy="96" r="2.6"/><circle cx="44" cy="96" r="2.6"/><circle cx="64" cy="96" r="2.6"/><circle cx="84" cy="96" r="2.6"/><circle cx="104" cy="96" r="2.6"/><circle cx="124" cy="96" r="2.6"/><circle cx="144" cy="96" r="2.6"/>
      </g>
    </g>
  </g>
</svg>
