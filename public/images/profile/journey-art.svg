<svg xmlns="http://www.w3.org/2000/svg" width="810" height="1080" viewBox="0 0 810 1080">
  <defs>
    <!-- Warm south: evening over the Indian Ocean -->
    <linearGradient id="warm" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f4b860"/>
      <stop offset="0.45" stop-color="#d97e4a"/>
      <stop offset="0.75" stop-color="#a8543f"/>
      <stop offset="1" stop-color="#5a3a4e"/>
    </linearGradient>
    <!-- Cool north: winter dusk -->
    <linearGradient id="cool" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#33455f"/>
      <stop offset="0.5" stop-color="#486084"/>
      <stop offset="1" stop-color="#93a9c6"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9c4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe9c4" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0.06 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <!-- ===== North (top) ===== -->
    <rect width="810" height="560" fill="url(#cool)"/>
    <circle cx="120" cy="96" r="26" fill="#e9eef5" opacity="0.85"/>
    <circle cx="132" cy="88" r="24" fill="url(#cool)"/>
    <!-- snowfall -->
    <g fill="#eef2f7">
      <circle cx="60" cy="180" r="2" opacity="0.7"/><circle cx="150" cy="240" r="1.6" opacity="0.5"/>
      <circle cx="240" cy="120" r="2" opacity="0.6"/><circle cx="330" cy="200" r="1.5" opacity="0.45"/>
      <circle cx="420" cy="90" r="2" opacity="0.7"/><circle cx="510" cy="170" r="1.6" opacity="0.5"/>
      <circle cx="600" cy="110" r="2" opacity="0.65"/><circle cx="690" cy="210" r="1.5" opacity="0.5"/>
      <circle cx="760" cy="150" r="2" opacity="0.6"/><circle cx="200" cy="330" r="1.5" opacity="0.4"/>
      <circle cx="640" cy="320" r="1.8" opacity="0.45"/><circle cx="90" cy="420" r="1.6" opacity="0.4"/>
    </g>
    <!-- skyline: Rostov-on-Don, cathedral domes -->
    <g fill="#232c3d">
      <rect x="0" y="392" width="810" height="168"/>
      <rect x="88" y="300" width="54" height="92"/>
      <rect x="102" y="252" width="26" height="52"/>
      <path d="M115 214 q-20 26 -13 40 h26 q7 -14 -13 -40 z"/>
      <line x1="115" y1="196" x2="115" y2="214" stroke="#232c3d" stroke-width="4"/>
      <circle cx="115" cy="194" r="5"/>
      <rect x="238" y="336" width="40" height="56"/>
      <rect x="352" y="356" width="34" height="36"/>
      <rect x="468" y="318" width="48" height="74"/>
      <rect x="482" y="286" width="20" height="34"/>
      <path d="M492 258 q-16 20 -10 30 h20 q6 -10 -10 -30 z"/>
      <rect x="608" y="344" width="44" height="48"/>
      <rect x="716" y="326" width="36" height="66"/>
      <rect x="726" y="296" width="16" height="32"/>
      <path d="M734 272 q-13 17 -8 26 h16 q5 -9 -8 -26 z"/>
    </g>
    <g fill="#eef2f7" opacity="0.9">
      <ellipse cx="405" cy="560" rx="480" ry="34"/>
    </g>
    <!-- north labels -->
    <text x="548" y="70" font-family="'Courier New', monospace" font-size="17" letter-spacing="2" fill="#eef2f7" opacity="0.92">ROSTOV-ON-DON</text>
    <text x="548" y="94" font-family="'Courier New', monospace" font-size="15" letter-spacing="1.5" fill="#eef2f7" opacity="0.7">47°14′N · 39°42′E</text>

    <!-- ===== South (bottom) ===== -->
    <rect y="560" width="810" height="520" fill="url(#warm)"/>
    <circle cx="250" cy="820" r="150" fill="url(#sunGlow)"/>
    <circle cx="250" cy="820" r="64" fill="#fdeccd"/>
    <rect y="884" width="810" height="196" fill="#241b18"/>
    <!-- ocean strip -->
    <rect y="884" width="810" height="0" fill="none"/>
    <!-- dhow -->
    <path d="M596 878 l64 0 l-12 14 l-40 0 z" fill="#241b18"/>
    <path d="M628 876 l0 -52 l30 50 z" fill="#241b18"/>
    <!-- acacia -->
    <g fill="#2a1c16">
      <path d="M64 884 l0 -96 q0 -10 8 -10 q8 0 8 10 l0 96 z"/>
      <path d="M72 796 q-64 -20 -96 -12 l96 -6 q-40 -26 -78 -28 q44 2 86 20 q8 -32 2 -58 q10 26 6 60 q34 -30 78 -34 q-44 14 -74 38 l4 22 z"/>
      <path d="M150 884 l0 -60 q0 -8 7 -8 q7 0 7 8 l0 60 z"/>
      <path d="M157 828 q-40 -14 -62 -8 l62 -4 q-26 -18 -52 -18 q30 2 56 14 q4 -22 0 -38 q8 18 4 40 q22 -20 50 -22 q-30 10 -52 26 l0 12 z"/>
      <path d="M736 884 l0 -74 q0 -9 8 -9 q8 0 8 9 l0 74 z"/>
      <path d="M744 814 q-50 -16 -76 -10 l76 -5 q-32 -20 -62 -20 q36 3 66 16 q4 -26 0 -44 q9 20 4 46 q26 -22 58 -26 q-34 12 -60 30 l0 13 z"/>
    </g>
    <!-- grass -->
    <g stroke="#241b18" stroke-width="3" stroke-linecap="round">
      <path d="M40 940 q6 -26 2 -44"/><path d="M70 952 q8 -30 4 -50"/><path d="M104 936 q-4 -26 2 -42"/>
      <path d="M180 958 q8 -28 6 -46"/><path d="M330 944 q6 -24 2 -40"/><path d="M420 960 q8 -30 4 -48"/>
      <path d="M500 938 q-4 -24 2 -40"/><path d="M560 956 q6 -26 4 -44"/><path d="M700 946 q6 -24 2 -40"/>
      <path d="M770 960 q8 -28 4 -46"/>
    </g>
    <!-- birds -->
    <g stroke="#3a2620" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M430 700 q10 -12 20 0"/><path d="M450 700 q10 -12 20 0"/>
      <path d="M500 724 q8 -10 16 0"/><path d="M516 724 q8 -10 16 0"/>
    </g>
    <!-- south labels -->
    <text x="52" y="1036" font-family="'Courier New', monospace" font-size="17" letter-spacing="2" fill="#f6e7cf" opacity="0.92">DAR ES SALAAM</text>
    <text x="52" y="1060" font-family="'Courier New', monospace" font-size="15" letter-spacing="1.5" fill="#f6e7cf" opacity="0.7">6°51′S · 39°17′E</text>

    <!-- ===== The meridian ===== -->
    <path d="M120 1010 C 40 700, 240 560, 420 470 S 690 250, 738 96"
      fill="none" stroke="#426be6" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>
    <!-- plane at arc midpoint -->
    <g transform="translate(474 388) rotate(-58)">
      <path d="M0 0 l54 0 l-10 12 l-44 0 z" fill="#eef2f7"/>
      <path d="M20 -2 l0 -26 l16 24 z" fill="#eef2f7"/>
      <path d="M20 12 l0 16 l12 -14 z" fill="#eef2f7"/>
    </g>
    <!-- meridian note -->
    <text x="420" y="530" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#f4f3ef">both on 39° east —</text>
    <text x="420" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#f4f3ef">the same meridian</text>

    <!-- ===== Stamp: TZ → RU ===== -->
    <g transform="translate(588 132) rotate(4)">
      <rect x="-8" y="-8" width="164" height="104" fill="#f4f3ef"/>
      <rect x="0" y="0" width="148" height="88" fill="#426be6"/>
      <g transform="translate(28 44)">
        <path d="M-14 0 l24 0 l-5 6 l-19 0 z" fill="#f4f3ef"/>
        <path d="M-2 -2 l0 -14 l9 13 z" fill="#f4f3ef"/>
        <path d="M-2 6 l0 8 l6 -6 z" fill="#f4f3ef"/>
      </g>
      <text x="64" y="38" font-family="'Courier New', monospace" font-size="15" letter-spacing="1.5" fill="#f4f3ef">TZ → RU</text>
      <text x="56" y="58" font-family="'Courier New', monospace" font-size="10" letter-spacing="0.5" fill="#dbe4f6">39°E MERIDIAN</text>
      <!-- perforation -->
      <g fill="#f4f3ef" opacity="0.85">
        <circle cx="-8" cy="0" r="2.6"/><circle cx="-8" cy="18" r="2.6"/><circle cx="-8" cy="36" r="2.6"/><circle cx="-8" cy="54" r="2.6"/><circle cx="-8" cy="72" r="2.6"/><circle cx="-8" cy="96" r="2.6"/>
        <circle cx="156" cy="0" r="2.6"/><circle cx="156" cy="18" r="2.6"/><circle cx="156" cy="36" r="2.6"/><circle cx="156" cy="54" r="2.6"/><circle cx="156" cy="72" r="2.6"/><circle cx="156" cy="96" r="2.6"/>
        <circle cx="4" cy="-8" r="2.6"/><circle cx="24" cy="-8" r="2.6"/><circle cx="44" cy="-8" r="2.6"/><circle cx="64" cy="-8" r="2.6"/><circle cx="84" cy="-8" r="2.6"/><circle cx="104" cy="-8" r="2.6"/><circle cx="124" cy="-8" r="2.6"/><circle cx="144" cy="-8" r="2.6"/>
        <circle cx="4" cy="96" r="2.6"/><circle cx="24" cy="96" r="2.6"/><circle cx="44" cy="96" r="2.6"/><circle cx="64" cy="96" r="2.6"/><circle cx="84" cy="96" r="2.6"/><circle cx="104" cy="96" r="2.6"/><circle cx="124" cy="96" r="2.6"/><circle cx="144" cy="96" r="2.6"/>
      </g>
    </g>
    <!-- postmark -->
    <g transform="translate(128 250) rotate(-10)" stroke="#eef2f7" fill="none" opacity="0.75">
      <circle r="52" stroke-width="3"/>
      <circle r="38" stroke-width="1.6"/>
      <text y="-8" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" letter-spacing="3" fill="#eef2f7" stroke="none">CISCO</text>
      <line x1="-30" y1="0" x2="30" y2="0" stroke-width="1.6"/>
      <text y="22" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#eef2f7" stroke="none">22 OCT 2026</text>
    </g>
  </g>
</svg>
